<div class="course-form">

  <form #termForm="ngForm" (ngSubmit)="onSubmit(termForm)">

    <div class="row g-3">

      <!-- Year -->
      <div class="col-md-12">

        <mat-form-field appearance="outline" class="modern-field">

          <mat-label>Year</mat-label>

          <input matInput type="number" name="year" [(ngModel)]="term.year" #year="ngModel"
            (focus)="isYearFocused = true" (blur)="isYearFocused = false" [ngClass]="{
              'active': term.year || isYearFocused
            }" required readonly (change)="onChange('year')" />

          <mat-icon matSuffix>event</mat-icon>

        </mat-form-field>

        <div class="text-danger small" *ngIf="year.invalid && year.touched">
          Year is required
        </div>

      </div>

      <div class="col-md-12">
        <mat-form-field appearance="outline" class="modern-field">
          <mat-label>Term Name</mat-label>

          <input matInput type="text" name="name" [(ngModel)]="term.name" #name="ngModel" required />

          <mat-icon matSuffix>school</mat-icon>
        </mat-form-field>

        <div class="text-danger small" *ngIf="name.invalid && name.touched">
          Term name is required
        </div>
      </div>

      <!-- Start Date -->
      <div class="col-md-12">

        <mat-form-field appearance="outline" class="modern-field">

          <mat-label>Start Date</mat-label>

          <input matInput type="date" name="startDate" [(ngModel)]="term.startDate" #startDate="ngModel"
            (change)="onStartDateChange()" (focus)="isStartDateFocused = true" (blur)="isStartDateFocused = false"
            [ngClass]="{
              'active': term.startDate || isStartDateFocused
            }" required (change)="onChange('startDate')" />

          <mat-icon matSuffix>calendar_month</mat-icon>

        </mat-form-field>

        <div class="text-danger small" *ngIf="startDate.invalid && startDate.touched">
          Start date is required
        </div>

      </div>


      <!-- End Date -->
      <div class="col-md-12">

        <mat-form-field appearance="outline" class="modern-field">

          <mat-label>End Date</mat-label>

          <input matInput type="date" name="endDate" [(ngModel)]="term.endDate" #endDate="ngModel" [min]="minEndDate"
            (focus)="isEndDateFocused = true" (blur)="isEndDateFocused = false" [ngClass]="{
              'active': term.endDate || isEndDateFocused
            }" required (change)="onChange('endDate')" />

          <mat-icon matSuffix>event_available</mat-icon>

        </mat-form-field>

        <div class="text-danger small" *ngIf="!isDateRangeValid() && endDate.touched">
          End date must be after start date
        </div>

      </div>

    </div>


    <!-- Actions -->
    <div class="form-actions">

      <button mat-stroked-button type="button" class="cancel-btn" (click)="cancelForm()">
        <mat-icon>close</mat-icon>
        Cancel
      </button>


      <button mat-flat-button type="submit" class="add-course-btn" [disabled]="termForm.invalid || !isDateRangeValid()">

        <mat-icon>
          {{
          term.id !==
          '00000000-0000-0000-0000-000000000000'
          ? 'save'
          : 'add'
          }}
        </mat-icon>

        {{
        term.id !==
        '00000000-0000-0000-0000-000000000000'
        ? 'Update Term'
        : 'Create Term'
        }}

      </button>

    </div>

  </form>

</div>
